<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil Ameida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="top">
    <h1 id="judul">Profil</h1>
    <button type="button" class="icon-btn" id="tema" aria-label="Ganti tema"></button>
  </header>
  <main class="main" id="main">
    <section class="view" id="v-beranda" aria-label="Beranda"></section>
    <section class="view" id="v-tentang" aria-label="Tentang saya" hidden></section>
    <section class="view" id="v-visi" aria-label="Visi dan Misi" hidden></section>
    <section class="view" id="v-program" aria-label="Program Kerja" hidden></section>
    <section class="view" id="v-kontak" aria-label="Kontak" hidden></section>
  </main>
  <nav class="tabs" id="tabs" aria-label="Navigasi utama"></nav>
</div>

<div class="sheet-bg" id="sheet-bg" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-head">
      <div>
        <p class="eyebrow" id="sheet-meta"></p>
        <h2 id="sheet-title"></h2>
      </div>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Tutup"></button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="script.js"></script>
</body>
</html>
